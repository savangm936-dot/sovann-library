function openBook(id){selectedBook=id;wordPage=0;bookSearch='';go('book')}
function wordRows(arr){return `<div class="words"><table><tr><th>漢字</th><th>ひらがな</th><th>Romaji</th><th>អត្ថន័យខ្មែរ</th><th>សំឡេង</th></tr>${arr.map(w=>`<tr><td><span class="jp">${escapeHTML(w.kanji)}</span></td><td>${escapeHTML(w.reading)}</td><td>${escapeHTML(w.romaji)}</td><td>${escapeHTML(w.khmer)} ${w.review?'⚠️':''}</td><td><button class="btn sm secondary" onclick="speak('${encodeURIComponent(w.reading||w.kanji)}')">🔊</button></td></tr>`).join('')}</table></div>`}
function bookPage(){const b=books.find(x=>x.id===selectedBook)||books[0],words=allWords(b.id);let filtered=words.filter(w=>[w.kanji,w.reading,w.romaji,w.khmer].some(a=>String(a||'').toLowerCase().includes(bookSearch.toLowerCase())));const pages=Math.max(1,Math.ceil(filtered.length/25));wordPage=Math.max(0,Math.min(wordPage,pages-1));let part=filtered.slice(wordPage*25,(wordPage+1)*25);return heading('📚 '+escapeHTML(b.title),b.desc)+`<div class="notice">${words.length} ពាក្យ។ មួយទំព័របង្ហាញ ២៥ ពាក្យ។ សៀវភៅ N5 និង N4 មានពាក្យដែលបានទាញពីឯកសារ Word ដែលបងផ្ញើ។ ពាក្យ ⚠️ ត្រូវពិនិត្យមុនផ្សាយ។</div><div class="panel"><div class="line space"><input id="bookSearch" class="field" style="max-width:520px" placeholder="ស្វែងរកពាក្យ..." value="${escapeHTML(bookSearch)}"><button class="btn secondary" onclick="go('books')">← សៀវភៅទាំងអស់</button></div><div id="bookTable" style="margin-top:12px">${wordRows(part)}${pages>1?`<div class="pagesel"><button class="btn sm secondary" onclick="wordPage=Math.max(0,wordPage-1);render()">← មុន</button><span>ទំព័រ ${wordPage+1} / ${pages}</span><button class="btn sm secondary" onclick="wordPage=Math.min(${pages-1},wordPage+1);render()">បន្ទាប់ →</button></div>`:''}</div></div>`}
function dictionary(){return heading('🔎 វចនានុក្រមជប៉ុន–ខ្មែរ','ស្វែងរក Kanji, Hiragana, Romaji ឬអត្ថន័យខ្មែរ')+`<div class="panel"><input id="dictSearch" class="field" placeholder="ឧ. 学校 / がっこう / gakkou / សាលារៀន" value="${escapeHTML(term)}"><div class="small muted" style="margin:10px 0">ស្វែងរកក្នុងពាក្យដែលបង្ហាញគំរូគ្រប់កម្រិត។</div><div id="dictResults">${dictResults()}</div></div>`}
function dictResults(){if(!term.trim())return '<div class="notice">សរសេរពាក្យក្នុងប្រអប់ខាងលើដើម្បីស្វែងរក។</div>';const arr=Object.keys(core).concat(Object.keys(custom)).flatMap(k=>allWords(k)).filter(w=>[w.kanji,w.reading,w.romaji,w.khmer].some(x=>String(x||'').toLowerCase().includes(term.toLowerCase()))).slice(0,100);return `<div class="small">រកឃើញ ${arr.length}${arr.length===100?'+':''} ពាក្យ</div>${wordRows(arr)}`}
function grammar(){const sections=[['ます形','ទម្រង់គួរសម','行く → 行きます','ទៅ / ទៅ (គួរសម)'],['て形','ភ្ជាប់សកម្មភាព ឬសុំឱ្យធ្វើ','食べる → 食べて','ញ៉ាំ → សូមញ៉ាំ'],['ない形','ទម្រង់បដិសេធ','飲む → 飲まない','ផឹក → មិនផឹក'],['た形','ទម្រង់អតីតកាល','読む → 読んだ','អាន → បានអាន'],['可能形','ទម្រង់សមត្ថភាព','話す → 話せる','និយាយ → អាចនិយាយបាន'],['～たことがある','ធ្លាប់មានបទពិសោធន៍','日本へ行ったことがあります。','ខ្ញុំធ្លាប់ទៅប្រទេសជប៉ុន។']];return heading('✍️ សៀវភៅវេយ្យាករណ៍','ពន្យល់ទម្រង់ជប៉ុនដោយភាសាខ្មែរ')+`<div class="grid two">${sections.map(s=>`<div class="panel"><span class="badge">${s[0]}</span><h3>${s[1]}</h3><p class="jp">${s[2]}</p><p>${s[3]}</p><button class="btn sm secondary" onclick="speak('${encodeURIComponent(s[2])}')">🔊 អានជប៉ុន</button></div>`).join('')}</div>`}
function kanji(){const list=[['日','にち / ひ','ថ្ងៃ / ព្រះអាទិត្យ'],['月','げつ / つき','ខែ / ព្រះចន្ទ'],['人','じん / ひと','មនុស្ស'],['山','さん / やま','ភ្នំ'],['川','せん / かわ','ទន្លេ'],['水','すい / みず','ទឹក'],['火','か / ひ','ភ្លើង'],['木','もく / き','ដើមឈើ'],['本','ほん / もと','សៀវភៅ / ដើម'],['学','がく / まなぶ','សិក្សា'],['校','こう','សាលារៀន'],['語','ご / かたる','ភាសា'],['大','だい / おおきい','ធំ'],['小','しょう / ちいさい','តូច'],['先','せん / さき','មុន'],['生','せい / いきる','ជីវិត / កំណើត']];return heading('🈶 សៀវភៅរៀនកានជី','ការអាន ការបកប្រែ និងគំរូសរសេរ')+`<div class="notice">ច្បាប់ទូទៅសរសេរ៖ ពីលើចុះក្រោម, ពីឆ្វេងទៅស្តាំ, ផ្ដេកមុនបញ្ឈរ។ លំដាប់បន្ទាត់ពិតសម្រាប់កានជីនីមួយៗត្រូវមានគំនូរជំហានដោយឡែក។</div><div class="grid">${list.map(a=>`<div class="card" style="padding:15px;text-align:center"><div style="font-size:62px;line-height:1.35;color:#593485">${a[0]}</div><div class="small">${a[1]}</div><strong>${a[2]}</strong><div><button class="btn sm secondary" onclick="speak('${encodeURIComponent(a[0])}')">🔊</button></div></div>`).join('')}</div>`}
function jlpt(){return heading('📝 វិញ្ញាសាប្រឡង JLPT','N5–N1 · គំរូមិនមែនវិញ្ញាសាផ្លូវការ')+`<div class="panel"><div class="line"><strong>ជ្រើសកម្រិត៖</strong>${['N5','N4','N3','N2','N1'].map(l=>`<button class="btn sm ${quizLevel===l?'':'secondary'}" onclick="quizLevel='${l}';resetQuiz();render()">${l}</button>`).join('')}</div><div id="question" style="margin-top:16px">${quizPanel()}</div></div>`}
const sampleQuiz={N5:[['「水」の意味は？',['ទឹក','សៀវភៅ','ផ្ទះ','សាលា'],0],['「行きます」は？',['ញ៉ាំ','ទៅ','មក','សរសេរ'],1]],N4:[['「約束」の意味は？',['ការសន្យា','ភ្លៀង','ព្រះចន្ទ','ការលក់'],0],['「準備」は？',['ការបញ្ចប់','ការត្រៀម','ការចាប់ផ្ដើម','ការសម្រាក'],1]],N3:[['「原因」の意味は？',['មូលហេតុ','ពេលវេលា','ការអញ្ជើញ','ទំនាក់ទំនង'],0]],N2:[['「課題」の意味は？',['បញ្ហាដែលត្រូវដោះស្រាយ','ដំណើរកម្សាន្ត','សៀវភៅ','ការបើកបរ'],0]],N1:[['「顕著」の意味は？',['លេចធ្លោ','ធម្មតា','ពិបាកចិត្ត','សាមញ្ញ'],0]]};
function resetQuiz(){quizIndex=0;quizChoice=null;quizScore=0;seconds=30;clearInterval(quizTimer);quizTimer=setInterval(()=>{if((location.hash||'#home')!=='#jlpt')return;seconds--;const t=$('#countdown');if(t)t.textContent=seconds+' វិនាទី';if(seconds<=0){clearInterval(quizTimer);quizChoice=-1;render()}},1000)}
function quizPanel(){let q=sampleQuiz[quizLevel],item=q[quizIndex];if(!item)return `<h3>🎉 ចប់ការប្រឡង!</h3><p>បានពិន្ទុ ${quizScore} / ${q.length}</p><button class="btn" onclick="resetQuiz();render()">ចាប់ផ្ដើមថ្មី</button>`;return `<div class="line space"><span class="badge">សំណួរ ${quizIndex+1}/${q.length}</span><b>⏱ <span id="countdown">${seconds} វិនាទី</span></b></div><h3>${item[0]}</h3>${item[1].map((a,i)=>`<button class="choice ${quizChoice===i?'selected':''}" onclick="pickQuiz(${i})" ${quizChoice!==null?'disabled':''}>${'ABCD'[i]}. ${a}</button>`).join('')}${quizChoice!==null?`<p style="color:${quizChoice===item[2]?'green':'#aa4266'}">${quizChoice===item[2]?'✅ ត្រឹមត្រូវ':'❌ ចម្លើយត្រឹមត្រូវ៖ '+item[1][item[2]]}</p><button class="btn" onclick="nextQuiz()">សំណួរបន្ទាប់ →</button>`:''}`}
function nextQuiz(){quizIndex++;quizChoice=null;seconds=30;render();clearInterval(quizTimer);quizTimer=setInterval(()=>{if((location.hash||'#home')!=='#jlpt')return;seconds--;const t=$('#countdown');if(t)t.textContent=seconds+' វិនាទី';if(seconds<=0){clearInterval(quizTimer);quizChoice=-1;render()}},1000)}
function pickQuiz(i){if(quizChoice!==null)return;quizChoice=i;clearInterval(quizTimer);if(i===sampleQuiz[quizLevel][quizIndex][2])quizScore++;render()}
function community(){return heading('📸 Sovann Community','គំរូបង្ហោះរូប Like និង Comment')+`<div class="notice warning">ការបង្ហោះនៅទំព័រនេះរក្សាទុក <b>តែក្នុង Browser ឧបករណ៍បង</b>។ សិស្សផ្សេងមិនទាន់មើលឃើញទេ រហូតដល់ភ្ជាប់ Server ពិត។</div><div class="panel"><h3>➕ បង្ហោះប្រកាសថ្មី</h3><form id="postForm" class="form"><input id="postName" class="field" placeholder="ឈ្មោះ" value="អ្នកសិក្សា" maxlength="60"><textarea id="postText" class="field" placeholder="តើបងចង់ចែករំលែកអ្វី?" required maxlength="1200"></textarea><label class="small">📷 បញ្ចូលរូបភាព (JPG/PNG តូចជាង 250 KB)</label><input type="file" id="postPhoto" accept="image/png,image/jpeg,image/webp"><button class="btn">បង្ហោះ Post</button></form></div><div id="posts">${postList()}</div>`}
function postList(){return posts.length?posts.slice().reverse().map(p=>`<div class="post"><div class="postby">🌸 ${escapeHTML(p.name)}</div><small class="muted">${new Date(p.when).toLocaleString()}</small><p>${escapeHTML(p.text)}</p>${p.image?`<img alt="រូបភាពប្រកាស" src="${p.image}">`:''}<div class="postactions"><button onclick="likePost('${p.id}')">❤️ Like ${p.likes||0}</button><button onclick="commentPost('${p.id}')">💬 Comment ${p.comments?.length||0}</button><button onclick="deletePost('${p.id}')">🗑️ លុប</button></div>${(p.comments||[]).map(c=>`<div class="comments">💬 ${escapeHTML(c)}</div>`).join('')}</div>`).join(''):'<div class="panel muted">នៅមិនទាន់មាន Post ទេ។ សាកល្បងបង្ហោះមួយមើល។</div>'}
function likePost(id){const p=posts.find(x=>x.id===id);if(p){p.likes=(p.likes||0)+1;save('posts',posts);render()}}
function commentPost(id){const s=prompt('សរសេរ Comment៖');if(!s?.trim())return;const p=posts.find(x=>x.id===id);if(p){p.comments=p.comments||[];p.comments.push(s.trim().slice(0,200));save('posts',posts);render()}}
function deletePost(id){if(!confirm('លុបប្រកាសនេះ?'))return;posts=posts.filter(x=>x.id!==id);save('posts',posts);render()}
function messenger(){return heading('💬 Sovann Messenger','គំរូ Chat ជាមួយគ្រូ និងក្រុមសិក្សា')+`<div class="notice warning">នេះជា <b>Chat សាកល្បងលើឧបករណ៍នេះប៉ុណ្ណោះ</b> មិនទាន់ផ្ញើសារទៅគ្រូ ឬសិស្សផ្សេងៗជាក់ស្តែងទេ។</div><div class="grid two"><div class="panel"><div class="line"><span class="pill">👨‍🏫 Sovan Sensei · គំរូ</span><span class="pill">👥 ថ្នាក់ N5–N1 (ត្រៀមភ្ជាប់)</span></div><div class="chat" id="chatlog" style="margin-top:12px">${messages.length?messages.map(m=>`<div class="bubble ${m.mine?'me':''}">${escapeHTML(m.text)}</div>`).join(''):'<div class="bubble">សួស្តី! នេះជាគំរូកម្មវិធី Chat របស់ Sovann Library។</div>'}</div><form id="chatForm" class="chatbar"><input class="field" name="text" placeholder="សរសេរសារ..." required><button class="btn">ផ្ញើ</button></form></div><div class="panel"><h3>មុខងារដែលត្រូវភ្ជាប់ Server</h3><p>✅ ប្រអប់ Chat និងសាររក្សាទុកក្នុងឧបករណ៍</p><p>🔌 បញ្ចូនសារទៅសិស្សផ្សេង</p><p>🔌 Group Chat និងការជូនដំណឹង</p><p>🔌 ផ្ញើសំឡេង និងវីដេអូខល</p></div></div>`}
function ai(){return heading('🤖 Sovan AI · សន្ទនាខ្មែរ–ជប៉ុន','អាចវាយសំណួរ និងស្តាប់ចម្លើយជាសំឡេងលើ Browser ដែលគាំទ្រ')+`<div class="notice warning">នេះជា <b>AI សន្ទនាគំរូ</b> ប្រើចម្លើយមានកំណត់ និងវចនានុក្រម មិនមែន AI ពេញលេញទេ។ មុខងារ AI ពិតត្រូវការ Backend និង API Key ដែលរក្សាសម្ងាត់នៅលើ Server។</div><div class="panel"><div class="line space"><span class="badge">🌸 Sovan AI · Demo</span><button class="btn sm secondary" onclick="speak('${encodeURIComponent('こんにちは。日本語を一緒に勉強しましょう。')}')">🔊 ស្តាប់ការណែនាំ</button></div><div id="ailog" class="chat" style="margin-top:12px">${aiLog.length?aiLog.map(x=>`<div class="bubble ${x.mine?'me':''}">${escapeHTML(x.text)}</div>`).join(''):'<div class="bubble">こんにちは！ សួស្តី! អ្នកអាចសួរពាក្យជប៉ុន ឬនិយាយ «こんにちは»។</div>'}</div><form id="aiForm" class="chatbar"><input class="field" name="text" placeholder="សួរសំណួរ ឬវាយពាក្យជប៉ុន..." required><button type="button" class="btn secondary" onclick="startMic()">🎙️</button><button class="btn">ផ្ញើ</button></form><p class="small muted">💡 សំឡេងអាចអានដោយ Web Speech API។ ការទទួលសំឡេងខ្មែរអាស្រ័យលើ Browser។</p></div>`}
function speak(enc){let text=decodeURIComponent(enc);if(!('speechSynthesis'in window))return toast('Browser មិនគាំទ្រសំឡេង');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=/[\u3040-\u30ff\u3400-\u9fff]/.test(text)?'ja-JP':'km-KH';u.rate=.87;speechSynthesis.speak(u)}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Browser នេះមិនគាំទ្រការទទួលសំឡេង សូមវាយសំណួរ');let r=new SR();r.lang='ja-JP';r.onresult=e=>{$('#aiForm input').value=e.results[0][0].transcript};r.onerror=()=>toast('មីក្រូមិនអាចដំណើរការបាន');r.start()}
function replyAI(q){const all=Object.keys(core).flatMap(k=>core[k]).concat(Object.values(custom).flat());const found=all.find(w=>[w.kanji,w.reading,w.romaji].some(a=>a&&String(a).toLowerCase()===q.toLowerCase()));if(found)return `${found.kanji}（${found.reading}）\nRomaji: ${found.romaji}\nភាសាខ្មែរ: ${found.khmer}`;if(/こんにちは|សួស្តី/i.test(q))return 'こんにちは！ខ្ញុំជាជំនួយការរៀនភាសាជប៉ុន។ តោះរៀនជាមួយគ្នា។';if(/ありがとう|អរគុណ/i.test(q))return 'どういたしまして！ មានន័យថា មិនបាច់អរគុណទេ។';if(/ます|て形|ない形/i.test(q))return 'ទម្រង់ ます ប្រើសម្រាប់ការនិយាយគួរសម។ សូមបើកម៉ឺនុយ «វេយ្យាករណ៍» ដើម្បីមើលឧទាហរណ៍។';return 'នេះជារបៀបសាកល្បង មិនទាន់អាចឆ្លើយសំណួរទាំងអស់បានទេ។ សាកសួរពាក្យ៖ 学校, 行きます ឬ こんにちは។'}
function video(){return heading('🎥 ថ្នាក់រៀន និងវីដេអូ','មេរៀន N5–N1 និង Group Video Call')+`<div class="grid two"><div class="panel"><h3>📹 បន្ទប់រៀនជាក្រុម</h3><p>ការបង្កើតបន្ទប់ Live Video Call ត្រូវការសេវា WebRTC / Jitsi / Video API។</p><p>អាចភ្ជាប់តំណ Zoom ឬ Jitsi បន្ទាប់ពីបងមានបន្ទប់រៀន។</p></div><div class="panel"><h3>🎬 វីដេអូមេរៀន</h3><p>សម្រាប់វីដេអូប្រឡង JLPT N5–N1 និងមេរៀនគ្រូអាន។</p><p class="small">បន្ថែម Video URL នៅពេលមានសេវា Hosting និងផ្ទាំង Admin ពិត។</p></div></div>`}
function shop(){return heading('🛍️ Sovann Shop','គំរូហាង និងមុខងារទូទាត់')+`<div class="grid three">${[['📚','សៀវភៅសិក្សា','$2.50'],['📒','សៀវភៅកត់ត្រា','$2.50'],['✏️','ឧបករណ៍រៀន','$1.50']].map(x=>`<div class="card"><div class="cover">${x[0]}</div><div class="cardbody"><b>${x[1]}</b><p>${x[2]}</p><button class="btn sm" onclick="toast('ត្រូវភ្ជាប់កន្ត្រកទិញ និង Server មុនប្រើពិត')">បន្ថែមទៅកន្ត្រក</button></div></div>`).join('')}</div>`}
function wallet(){return heading('👛 កាបូបលុយ និងសមាជិកភាព','ABA / PayWay និងគម្រោងសិស្ស')+`<div class="notice warning">កុំផ្ទេរប្រាក់នៅក្នុងគំរូនេះ។ ការបញ្ចូល Credit ត្រូវផ្ទៀងផ្ទាត់លើ Server និងដោយ Admin ទើបមានសុវត្ថិភាព។</div><div class="grid three">${[['១ ខែ','$2.50'],['១ ឆ្នាំ','$23.99'],['មួយជីវិត','$35.00']].map(x=>`<div class="panel"><h3>${x[0]}</h3><div class="jp">${x[1]}</div><p>មើលមេរៀនដែលបានបើកសិទ្ធិ</p><button class="btn sm" onclick="toast('ត្រូវភ្ជាប់ការបង់ប្រាក់ពិត')">ជ្រើសគម្រោង</button></div>`).join('')}</div>`}
function login(){return heading('👤 ចូលគណនីតាម Google','Google Authentication សម្រាប់សិស្ស និង Admin')+`<div class="panel" style="max-width:630px;margin:auto"><h3>🔐 Google Login</h3><div class="notice warning">ប៊ូតុងនេះមិនទាន់ភ្ជាប់ Google OAuth ពិតទេ។ ត្រូវបង្កើត Google Client ID របស់បង និងដំឡើង Backend ដែលផ្ទៀងផ្ទាត់ ID Token ទើបសិស្សអាចចូលគណនីសុវត្ថិភាពបាន។</div><button class="btn secondary" onclick="toast('ត្រូវការភ្ជាប់ Google Client ID និង Server សិន')">🌐 Sign in with Google</button><p class="small muted">សូមកុំផ្ញើលេខសម្ងាត់ Gmail ឬ Secret Key មកក្នុង Chat។ សិទ្ធិ Admin ត្រូវផ្ទៀងផ្ទាត់នៅ Server មិនមែននៅ JavaScript ដែលគេមើលឃើញបានទេ។</p></div>`}
function admin(){const own=Object.values(custom).reduce((n,a)=>n+a.length,0);return heading('⚙️ Admin · កែពាក្យសព្ទ','ឧបករណ៍បន្ថែមពាក្យនៅក្នុងគំរូ GitHub Pages')+`<div class="notice warning"><b>Admin គំរូ មិនមែនសិទ្ធិ Admin មានការពារពិត!</b> ពាក្យដែលបងបញ្ចូលត្រូវរក្សាទុកក្នុង Browser នេះប៉ុណ្ណោះ។ ចង់ឱ្យសិស្សទាំងអស់ឃើញ និងការពារការកែប្រែ ត្រូវប្រើ Google Login + Server + Database។</div><div class="grid two"><div class="panel"><h3>➕ បន្ថែមពាក្យមួយ</h3><form id="addWord" class="form"><label class="label">ជ្រើសសៀវភៅ</label><select class="field" name="book" required>${books.map(b=>`<option value="${b.id}">${b.title}</option>`).join('')}</select><input class="field" name="kanji" placeholder="漢字 / Japanese" required><input class="field" name="reading" placeholder="Hiragana" required><input class="field" name="romaji" placeholder="Romaji"><input class="field" name="khmer" placeholder="អត្ថន័យខ្មែរ" required><button class="btn">➕ រក្សាទុកពាក្យ</button></form></div><div class="panel"><h3>📥 នាំចូលពាក្យពី Excel/CSV</h3><p class="small">ក្នុងមួយលើកអាចដាក់ ១,០០០ បន្ទាត់។ សរសេរ៖ Kanji,Hiragana,Romaji,Khmer ឬប្រើសញ្ញា | បែងចែក។</p><form id="bulkForm" class="form"><select class="field" name="book">${books.map(b=>`<option value="${b.id}">${b.title}</option>`).join('')}</select><input type="file" id="csvFile" accept=".csv,text/csv"><textarea class="field" name="lines" placeholder="学校|がっこう|gakkou|សាលារៀន\n先生|せんせい|sensei|គ្រូបង្រៀន"></textarea><button class="btn">📥 នាំចូលរហូតដល់ ១,០០០ ពាក្យ</button></form><button class="btn sm secondary" onclick="downloadBackup()">⬇️ Backup ពាក្យដែលបងបានបន្ថែម</button></div></div><div class="panel"><h3>📊 ពាក្យបានបន្ថែមនៅលើឧបករណ៍នេះ៖ ${own}</h3><p class="small muted">អាចលុបពាក្យដែលបានបន្ថែមតាម LocalStorage ប៉ុណ្ណោះ។ កុំប្រើវាសម្រាប់គ្រប់គ្រងសិស្សពិត។</p>${Object.entries(custom).map(([k,v])=>`<p><b>${k}</b> — ${v.length} ពាក្យ</p>`).join('')}</div>`}
function render(){const p=(location.hash||'#home').slice(1)||'home';$('#nav').innerHTML=menus.map(m=>`<button class="${p===m[0]?'active':''}" onclick="go('${m[0]}')">${m[1]} ${m[2]}</button>`).join('');const pages={home,books:bookList,book:bookPage,dictionary,grammar,kanji,jlpt,community,messenger,ai,video,shop,wallet,login,admin};$('#app').innerHTML=(pages[p]||home)();if(p==='jlpt'&&quizTimer===null)resetQuiz();if(p==='ai'||p==='messenger'){const el=$('#ailog')||$('#chatlog');if(el)el.scrollTop=el.scrollHeight}}
function csvSplit(line){const sep=line.includes('|')?'|':',';const out=[];let s='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){s+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){out.push(s.trim());s=''}else s+=c}out.push(s.trim());return out}
function downloadBackup(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(custom,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='sovann-local-vocabulary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.addEventListener('submit',async e=>{const f=e.target;if(!['addWord','bulkForm','postForm','chatForm','aiForm'].includes(f.id))return;e.preventDefault();const d=new FormData(f);if(f.id==='addWord'){const k=d.get('book');custom[k]=custom[k]||[];custom[k].push({kanji:String(d.get('kanji')).trim(),reading:String(d.get('reading')).trim(),romaji:String(d.get('romaji')).trim(),khmer:String(d.get('khmer')).trim()});save('words',custom);toast('បានបន្ថែមពាក្យ');render()}else if(f.id==='bulkForm'){let raw=String(d.get('lines')||'');const file=$('#csvFile').files?.[0];if(file)raw=await file.text();const lines=raw.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return toast('សូមបញ្ចូលពាក្យជាមុន');if(lines.length>1000)return toast('អាចបញ្ចូលបានតែ ១,០០០ ពាក្យក្នុងមួយលើក');const k=d.get('book');custom[k]=custom[k]||[];let count=0;for(const l of lines){const a=csvSplit(l);if(a.length<4||!a[0]||!a[3]||['kanji','漢字'].includes(a[0].toLowerCase()))continue;custom[k].push({kanji:a[0],reading:a[1],romaji:a[2],khmer:a[3]});count++}save('words',custom);toast('បានបន្ថែម '+count+' ពាក្យលើឧបករណ៍នេះ');render()}else if(f.id==='postForm'){const file=$('#postPhoto').files?.[0];let img='';if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>250000)return toast('រូបថតត្រូវតូចជាង 250 KB និងជា JPG/PNG/WebP');img=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(file)})}posts.push({id:Date.now().toString(36),name:String($('#postName').value||'សិស្ស').slice(0,60),text:String($('#postText').value).slice(0,1200),image:img,likes:0,comments:[],when:Date.now()});if(save('posts',posts)){toast('បានបង្ហោះក្នុង Browser សាកល្បង');render()}}else if(f.id==='chatForm'){const q=String(d.get('text')).trim();if(!q)return;messages.push({mine:true,text:q},{mine:false,text:'[ចម្លើយគំរូស្វ័យប្រវត្តិ] សូមស្វាគមន៍! Chat ជាមួយគ្រូពិតនឹងដំណើរការក្រោយភ្ជាប់ Server។'});save('messages',messages);render()}else if(f.id==='aiForm'){const q=String(d.get('text')).trim();if(!q)return;const r=replyAI(q);aiLog.push({mine:true,text:q},{mine:false,text:r});save('ai',aiLog);render();speak(encodeURIComponent(r))}});
document.addEventListener('input',e=>{if(e.target.id==='dictSearch'){term=e.target.value;$('#dictResults').innerHTML=dictResults()}if(e.target.id==='bookSearch'){bookSearch=e.target.value;wordPage=0;const input=document.activeElement;render();const el=$('#bookSearch');el.focus();el.setSelectionRange(el.value.length,el.value.length)}});
window.addEventListener('hashchange',render);render();
</script></body></html>
